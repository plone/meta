name: Container Image Publish
description: Publish an image to the container registry

on:
  workflow_call:
    inputs:
      base-tag:
        required: true
        type: string
      working-directory:
        required: true
        type: string
        default: "."
      image-name-prefix:
        required: true
        type: string
      image-name-suffix:
        required: true
        type: string
      image-cache-suffix:
        required: false
        type: string
        default: buildcache
      platforms:
        required: false
        default: "linux/amd64"
        type: string
      dockerfile:
        required: false
        default: Dockerfile
        type: string
      registry:
        required: false
        default: "ghcr.io"
        type: string
      build-args:
        required: false
        default: ""
        type: string
      cache-key:
        required: false
        default: ${{ github.ref_name }}
        type: string
    secrets:
        username:
            required: true
        password:
            required: true

jobs:

  build:
    name: "Image ${{ inputs.image-name-prefix }}-${{ inputs.image-name-suffix }}:${{ inputs.base-tag }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.username }}
          password: ${{ secrets.password }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ inputs.image-name-prefix }}-${{ inputs.image-name-suffix }}
          flavor:
            latest=false
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=${{ inputs.base-tag }}
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}
            type=pep440,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Compute build cache references
        id: cache
        env:
          IMAGE: ${{ inputs.image-name-prefix }}-${{ inputs.image-name-suffix }}
          CACHE_SUFFIX: ${{ inputs.image-cache-suffix }}
          CACHE_KEY: ${{ inputs.cache-key }}
          BASE_TAG: ${{ inputs.base-tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Image tags only allow [A-Za-z0-9_.-], and branch names such as
          # "feature/x" don't, so normalize the keys.
          sanitize() { printf '%s' "$1" | tr -c 'A-Za-z0-9_.-' '-' | cut -c1-100; }
          key="$(sanitize "$CACHE_KEY")"
          base="$(sanitize "$BASE_TAG")"
          default="$(sanitize "$DEFAULT_BRANCH")"
          # Write the cache for the branch (or the given cache-key), so the next
          # build of the same branch, and the push job of the same run, reuse it.
          echo "cache-to=type=registry,ref=${IMAGE}:${CACHE_SUFFIX}-${key},mode=max" >> "$GITHUB_OUTPUT"
          # Read the cache of this commit, then of the branch, then of the
          # default branch as a fallback for new branches.
          {
            echo "cache-from<<EOF"
            echo "type=registry,ref=${IMAGE}:${CACHE_SUFFIX}-${base}"
            if [ "$key" != "$base" ]; then
              echo "type=registry,ref=${IMAGE}:${CACHE_SUFFIX}-${key}"
            fi
            if [ -n "$default" ] && [ "$default" != "$key" ]; then
              echo "type=registry,ref=${IMAGE}:${CACHE_SUFFIX}-${default}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Image
        uses: docker/build-push-action@v7
        with:
          context:  ${{ inputs.working-directory }}
          file: ${{ inputs.working-directory }}/${{ inputs.dockerfile }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ inputs.platforms }}
          push: true
          cache-from: ${{ steps.cache.outputs.cache-from }}
          cache-to: ${{ steps.cache.outputs.cache-to }}
          build-args: ${{ inputs.build-args }}
